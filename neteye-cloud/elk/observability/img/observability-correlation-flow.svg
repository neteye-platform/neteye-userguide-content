<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B3B3B3"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1000" height="330" fill="#4A4A4A"/>

  <!-- Observability panel -->
  <rect x="80" y="60" width="840" height="232" rx="4" fill="#333333"/>
  <text x="100" y="90" font-size="18" font-weight="700" fill="#FFFFFF">Observability</text>

  <!-- Start -->
  <circle cx="40" cy="148" r="16" fill="#0BB798"/>

  <!-- Step boxes -->
  <g font-size="14" fill="#FFFFFF" text-anchor="middle">
    <rect x="110" y="120" width="160" height="56" rx="8" fill="#5C5C5C"/>
    <text x="190" y="153">Alerts</text>

    <rect x="315" y="120" width="160" height="56" rx="8" fill="#5C5C5C"/>
    <text x="395" y="153">Applications (APM)</text>

    <rect x="520" y="120" width="160" height="56" rx="8" fill="#5C5C5C"/>
    <text x="600" y="153">Infrastructure</text>

    <rect x="725" y="120" width="160" height="56" rx="8" fill="#5C5C5C"/>
    <text x="805" y="153">Logs</text>
  </g>

  <!-- Details under each step -->
  <g font-size="12" fill="#CFCFCF" text-anchor="middle">
    <text x="190" y="200">payment-service response</text>
    <text x="190" y="217">time above 1.5 s</text>

    <text x="395" y="200">Time is spent waiting</text>
    <text x="395" y="217">for the database</text>

    <text x="600" y="200">Database host:</text>
    <text x="600" y="217">disk I/O at 100%</text>

    <text x="805" y="200">Scheduled backup</text>
    <text x="805" y="217">job started</text>
  </g>
  <g font-size="12" fill="#0BB798" text-anchor="middle">
    <text x="190" y="240">09:42 · Symptom</text>
    <text x="395" y="240">09:37 · Traces</text>
    <text x="600" y="240">09:35 · Metrics</text>
    <text x="805" y="240">09:35 · Cause</text>
  </g>

  <!-- Shared context -->
  <text x="500" y="274" font-size="12" font-style="italic" fill="#B3B3B3" text-anchor="middle">Same time range and filters in every view</text>

  <!-- End -->
  <circle cx="960" cy="148" r="16" fill="#0BB798"/>
  <text x="960" y="152" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">END</text>

  <!-- Arrows -->
  <g stroke="#B3B3B3" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="58" y1="148" x2="106" y2="148"/>
    <line x1="272" y1="148" x2="311" y2="148"/>
    <line x1="477" y1="148" x2="516" y2="148"/>
    <line x1="682" y1="148" x2="721" y2="148"/>
    <line x1="887" y1="148" x2="940" y2="148"/>
  </g>
</svg>
