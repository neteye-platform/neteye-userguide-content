<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="520" viewBox="0 0 1176 520" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif">
  <title>NetEye.Cloud Satellite firewall flows</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C6C6C6"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1176" height="520" fill="#262626"/>

  <!-- Customer network -->
  <rect x="24.5" y="24.5" width="679" height="439" fill="#393939" stroke="#6F6F6F" stroke-dasharray="3 3"/>
  <rect x="24" y="24" width="680" height="4" fill="#6F6F6F"/>
  <text x="40" y="56" font-size="16" font-weight="600" fill="#F4F4F4">Customer network</text>
  <rect x="40.5" y="80.5" width="167" height="367" fill="#262626" stroke="#6F6F6F" stroke-dasharray="3 3"/>
  <rect x="40" y="80" width="168" height="4" fill="#6F6F6F"/>
  <text x="56" y="108" font-size="14" font-weight="600" fill="#F4F4F4">Customer hosts</text>
  <rect x="56.5" y="168.5" width="135" height="31" fill="#393939" stroke="#6F6F6F"/>
  <text x="72" y="189" font-size="14" fill="#F4F4F4">Host A</text>
  <rect x="56.5" y="268.5" width="135" height="31" fill="#393939" stroke="#6F6F6F"/>
  <text x="72" y="289" font-size="14" fill="#F4F4F4">Host B</text>
  <rect x="56.5" y="368.5" width="135" height="31" fill="#393939" stroke="#6F6F6F"/>
  <text x="72" y="389" font-size="14" fill="#F4F4F4">Host n</text>
  <text x="56" y="418" font-size="12" fill="#C6C6C6">Icinga agent</text>
  <text x="56" y="434" font-size="12" fill="#C6C6C6">on each host</text>
  <rect x="496.5" y="80.5" width="191" height="367" fill="#1E2C29" stroke="#0A9D81" stroke-dasharray="3 3"/>
  <rect x="496" y="80" width="192" height="4" fill="#0A9D81"/>
  <text x="512" y="108" font-size="14" font-weight="600" fill="#F4F4F4">NetEye Satellites</text>
  <rect x="512.5" y="240.5" width="159" height="31" fill="#393939" stroke="#6F6F6F"/>
  <text x="528" y="261" font-size="14" fill="#F4F4F4">Satellite A</text>
  <rect x="512.5" y="296.5" width="159" height="31" fill="#393939" stroke="#6F6F6F"/>
  <text x="528" y="317" font-size="14" fill="#F4F4F4">Satellite B</text>

  <!-- NetEye.Cloud -->
  <rect x="896.5" y="24.5" width="255" height="439" fill="#1E2C29" stroke="#0A9D81" stroke-dasharray="3 3"/>
  <rect x="896" y="24" width="256" height="4" fill="#0A9D81"/>
  <text x="912" y="56" font-size="16" font-weight="600" fill="#F4F4F4">NetEye.Cloud</text>
  <rect x="912.5" y="268.5" width="223" height="31" fill="#393939" stroke="#6F6F6F"/>
  <text x="928" y="289" font-size="14" fill="#F4F4F4">NetEye.Cloud Master</text>

  <!-- Flows: customer hosts and NetEye Satellites -->
  <g stroke="#C6C6C6" stroke-width="2" fill="none">
    <line x1="212" y1="144" x2="492" y2="144" marker-end="url(#arrow)"/>
    <line x1="212" y1="184" x2="492" y2="184" stroke-dasharray="8 4" marker-end="url(#arrow)"/>
    <line x1="212" y1="224" x2="492" y2="224" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="212" y1="264" x2="492" y2="264" marker-end="url(#arrow)"/>
    <line x1="212" y1="304" x2="492" y2="304" stroke-dasharray="8 4" marker-end="url(#arrow)"/>
    <line x1="212" y1="344" x2="492" y2="344" stroke-dasharray="8 4" marker-end="url(#arrow)"/>
    <line x1="212" y1="384" x2="492" y2="384" stroke-dasharray="8 4" marker-end="url(#arrow)"/>
    <line x1="212" y1="424" x2="492" y2="424" marker-end="url(#arrow)"/>
  </g>
  <text x="352" y="136" font-size="14" text-anchor="middle" fill="#C6C6C6"><tspan font-weight="600" fill="#F4F4F4">NATS</tspan> TCP 4222</text>
  <text x="352" y="176" font-size="14" text-anchor="middle" fill="#C6C6C6"><tspan font-weight="600" fill="#F4F4F4">Logstash</tspan> TCP 5045</text>
  <text x="352" y="216" font-size="14" text-anchor="middle" fill="#C6C6C6"><tspan font-weight="600" fill="#F4F4F4">Icinga 2</tspan> TCP 5665</text>
  <text x="352" y="256" font-size="14" text-anchor="middle" fill="#C6C6C6"><tspan font-weight="600" fill="#F4F4F4">Syslog (standard)</tspan> TCP/UDP 514</text>
  <text x="352" y="296" font-size="14" text-anchor="middle" fill="#C6C6C6"><tspan font-weight="600" fill="#F4F4F4">Syslog (various)</tspan> TCP/UDP 5001-5199</text>
  <text x="352" y="336" font-size="14" text-anchor="middle" fill="#C6C6C6"><tspan font-weight="600" fill="#F4F4F4">Elastic Agent / Fleet</tspan> TCP 8220</text>
  <text x="352" y="376" font-size="14" text-anchor="middle" fill="#C6C6C6"><tspan font-weight="600" fill="#F4F4F4">Elasticsearch data</tspan> TCP 9200</text>
  <text x="352" y="416" font-size="14" text-anchor="middle" fill="#C6C6C6"><tspan font-weight="600" fill="#F4F4F4">HTTPS</tspan> TCP 443</text>

  <!-- Flows: NetEye Satellites and NetEye.Cloud Master -->
  <g stroke="#C6C6C6" stroke-width="2" fill="none">
    <line x1="692" y1="184" x2="892" y2="184" marker-end="url(#arrow)"/>
    <line x1="692" y1="224" x2="892" y2="224" marker-end="url(#arrow)"/>
    <line x1="692" y1="264" x2="892" y2="264" stroke-dasharray="8 4" marker-end="url(#arrow)"/>
    <line x1="692" y1="304" x2="892" y2="304" stroke-dasharray="8 4" marker-end="url(#arrow)"/>
    <line x1="892" y1="344" x2="692" y2="344" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
    <line x1="892" y1="384" x2="692" y2="384" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  </g>
  <text x="800" y="176" font-size="14" text-anchor="middle" fill="#C6C6C6"><tspan font-weight="600" fill="#F4F4F4">NATS Leaf Node</tspan> TCP 7422</text>
  <text x="800" y="216" font-size="14" text-anchor="middle" fill="#C6C6C6"><tspan font-weight="600" fill="#F4F4F4">Icinga 2</tspan> TCP 5665</text>
  <text x="800" y="256" font-size="14" text-anchor="middle" fill="#C6C6C6"><tspan font-weight="600" fill="#F4F4F4">Elastic</tspan> TCP 8220, 9200</text>
  <text x="800" y="296" font-size="14" text-anchor="middle" fill="#C6C6C6"><tspan font-weight="600" fill="#F4F4F4">Logstash</tspan> TCP 5000</text>
  <text x="800" y="336" font-size="14" text-anchor="middle" fill="#C6C6C6"><tspan font-weight="600" fill="#F4F4F4">SSH</tspan> TCP 22</text>
  <text x="800" y="376" font-size="14" text-anchor="middle" fill="#C6C6C6"><tspan font-weight="600" fill="#F4F4F4">HTTPS</tspan> TCP 443</text>
  <rect x="760.5" y="108.5" width="79" height="23" rx="12" fill="#262626" stroke="#6F6F6F"/>
  <text x="800" y="124" font-size="12" fill="#F4F4F4" text-anchor="middle">Internet</text>

  <!-- Legend -->
  <g stroke="#C6C6C6" stroke-width="2" fill="none">
    <line x1="24" y1="492" x2="64" y2="492"/>
    <line x1="160" y1="492" x2="200" y2="492" stroke-dasharray="8 4"/>
    <line x1="488" y1="492" x2="528" y2="492" stroke-dasharray="2 4"/>
  </g>
  <g font-size="12" fill="#C6C6C6">
    <text x="72" y="496">Baseline</text>
    <text x="208" y="496">Subscription, module, or source dependent</text>
    <text x="536" y="496">Only after confirmation during onboarding</text>
  </g>
</svg>
