<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Client request path to a NetEye Kubernetes Pod</title>
  <desc id="desc">A client sends a request to a Cilium L2-announced LoadBalancer virtual IP. Cilium eBPF forwards it to Envoy Gateway, a Kubernetes Service, and a selected Pod.</desc>
  <style>
    text { font-family: sans-serif; fill: #172033; }
    .heading { font-size: 24px; font-weight: 700; }
    .label { font-size: 18px; font-weight: 700; }
    .body { font-size: 14px; }
    .box { fill: #ffffff; stroke: #58708a; stroke-width: 2; }
    .vip { fill: #fff3dc; stroke: #a26a16; stroke-width: 2; }
    .ebpf { fill: #263c5c; stroke: #172b48; stroke-width: 2; }
    .service { fill: #eaf6ed; stroke: #3c7a4a; stroke-width: 2; }
    .arrow { fill: none; stroke: #51667e; stroke-width: 3; marker-end: url(#arrow); }
    .note { font-size: 13px; fill: #4b5e73; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#51667e"/>
    </marker>
  </defs>

  <text x="50" y="52" class="heading">How a client request reaches an application Pod</text>

  <rect x="55" y="180" width="150" height="120" rx="8" class="box"/>
  <text x="98" y="222" class="label">Client</text>
  <text x="75" y="250" class="body">Trusted network</text>
  <text x="75" y="274" class="body">zone</text>

  <rect x="265" y="155" width="190" height="170" rx="8" class="vip"/>
  <text x="295" y="197" class="label">LoadBalancer VIP</text>
  <text x="295" y="225" class="body">service_loadbalancer_cidr</text>
  <text x="295" y="257" class="body">Cilium replies to ARP</text>
  <text x="295" y="281" class="body">on one elected node</text>

  <rect x="515" y="115" width="210" height="250" rx="8" class="ebpf"/>
  <text x="555" y="157" font-size="19" font-family="sans-serif" font-weight="700" fill="#ffffff">Cilium eBPF</text>
  <text x="540" y="191" font-size="14" font-family="sans-serif" fill="#ffffff">Service lookup</text>
  <text x="540" y="218" font-size="14" font-family="sans-serif" fill="#ffffff">Policy enforcement</text>
  <text x="540" y="245" font-size="14" font-family="sans-serif" fill="#ffffff">Traffic forwarding</text>
  <text x="540" y="300" font-size="13" font-family="sans-serif" fill="#ffffff">eBPF handles traffic before</text>
  <text x="540" y="321" font-size="13" font-family="sans-serif" fill="#ffffff">the ordinary host stack.</text>

  <rect x="785" y="155" width="150" height="170" rx="8" class="service"/>
  <text x="823" y="198" class="label">Envoy</text>
  <text x="807" y="227" class="body">Gateway API</text>
  <text x="807" y="251" class="body">listener</text>
  <text x="807" y="287" class="note">Routes the request</text>

  <rect x="995" y="155" width="150" height="170" rx="8" class="service"/>
  <text x="1025" y="198" class="label">Pod</text>
  <text x="1015" y="227" class="body">Application</text>
  <text x="1015" y="251" class="body">pod_cidr address</text>
  <text x="1015" y="287" class="note">Selected backend</text>

  <path d="M205 240 H255" class="arrow"/>
  <path d="M455 240 H505" class="arrow"/>
  <path d="M725 240 H775" class="arrow"/>
  <path d="M935 240 H985" class="arrow"/>
  <text x="264" y="385" class="note">The Pod and Service CIDRs are not exposed to the client.</text>
  <text x="264" y="410" class="note">For Pod egress, Cilium masquerades private Pod addresses to a node address when required.</text>
</svg>
